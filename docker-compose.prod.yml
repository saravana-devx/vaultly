# Production stack for a single VPS (2-4 GB RAM). Only Caddy publishes ports (80/443).
# Postgres, Redis, Kafka, OpenBao and the API stay on the private Docker network.
#
#   cp deploy/env.prod.example .env     # fill it in (see docs/14_GO_LIVE_RUNBOOK.txt)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev compose: no published data-store ports, passwords on Postgres/Redis,
# Kafka/OpenBao/Redis data persisted, log rotation, restart policies, no Mailpit, webhooks cannot
# call private addresses, Caddy terminates TLS and sets security headers.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    restart: unless-stopped
    logging: *logging
    depends_on: [backend]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.server
    restart: unless-stopped
    logging: *logging
    environment:
      APP_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MASTER_KEY: ${MASTER_KEY:-}
      DATABASE_URL: postgres://vaultly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vaultly?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      RATELIMITER_URL: http://ratelimiter:8080
      KAFKA_BROKERS: kafka:9092
      KEY_PROVIDER: openbao
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /token/app-token
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost}
    volumes:
      - baotoken:/token:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ratelimiter: { condition: service_started }
      kafka: { condition: service_started }
      openbao-bootstrap: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: vaultly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vaultly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultly"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Rate-limit decisions come from the separate Distributed-rate-limiter service (built from its own
  # repository; set RATELIMITER_SRC to a local clone if the repo is private). Its admin API has no
  # authentication, so it is never published; the backend falls back to its built-in limiter if it is down.
  ratelimiter-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ratelimiter
    volumes:
      - ./deploy/ratelimiter:/docker-entrypoint-initdb.d:ro
      - ratelimiterdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter -d ratelimiter"]
      interval: 5s
      retries: 20

  ratelimiter:
    build:
      context: ./deploy/ratelimiter
      dockerfile: Dockerfile.server
      additional_contexts:
        src: ${RATELIMITER_SRC:-https://github.com/saravana-devx/Distributed-rate-limiter.git}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_HOST: ratelimiter-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ratelimiter
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_PORT: "8080"
      GIN_MODE: release
    depends_on:
      ratelimiter-db: { condition: service_healthy }
      redis: { condition: service_healthy }

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24          # the database is the audit source of truth
      KAFKA_HEAP_OPTS: -Xms256M -Xmx512M     # keep the JVM small on a small VPS
    volumes: [kafkadata:/var/lib/kafka/data]

  # Key service. Its data lives in the baodata volume - BACK IT UP (deploy/backup.sh).
  openbao:
    image: openbao/openbao:2.7.3
    command: server
    restart: unless-stopped
    logging: *logging
    cap_add: [IPC_LOCK]
    environment:
      BAO_LOCAL_CONFIG: |
        {
          "ui": false,
          "disable_mlock": true,
          "api_addr": "http://openbao:8200",
          "cluster_addr": "http://openbao:8201",
          "storage": { "raft": { "path": "/openbao/file", "node_id": "vaultly-1" } },
          "listener": { "tcp": { "address": "0.0.0.0:8200", "tls_disable": true } }
        }
    volumes: [baodata:/openbao/file]

  openbao-bootstrap:
    image: openbao/openbao:2.7.3
    user: "0"
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: unless-stopped
    logging: *logging
    depends_on: [openbao]
    volumes:
      - ./openbao/bootstrap.sh:/bootstrap.sh:ro
      - baoboot:/boot
      - baotoken:/token

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  ratelimiterdata:
  kafkadata:
  baodata:
  baoboot:
  baotoken:
