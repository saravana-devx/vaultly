name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultly
          POSTGRES_PASSWORD: vaultly
          POSTGRES_DB: vaultly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultly" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vaultly:vaultly@localhost:5432/vaultly?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the dev compose file
        run: |
          printf 'JWT_SECRET=ci-only-not-a-real-secret-0123456789abcdef\nMASTER_KEY=\n' > .env
          docker compose -f docker-compose.yml config -q
      - name: Validate the production compose file
        env:
          DOMAIN: example.com
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config -q
