server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $upstream http://backend:8080;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
  }
  # Built files carry a content hash in their name, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # The page itself (and theme-init.js) must be re-checked every time, otherwise browsers can keep
  # showing an old version of the app after an update.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
